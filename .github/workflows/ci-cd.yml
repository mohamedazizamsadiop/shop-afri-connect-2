name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:latest
        options: >-
          --health-cmd "mongosh --eval \"db.adminCommand('ping')\" || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'server/package-lock.json'

      - name: Install dependencies (server)
        working-directory: ./server
        run: npm install --legacy-peer-deps

      - name: Run server tests
        working-directory: ./server
        env:
          TEST_MONGODB_URI: mongodb://localhost:27017/markethub-test
          JWT_SECRET: test-secret
          STRIPE_SECRET: sk_test_fake
          STRIPE_WEBHOOK_SECRET: whsec_test_fake
        run: npm test -- --forceExit --detectOpenHandles

      - name: Lint server
        working-directory: ./server
        run: npm run lint || echo "No lint script"

  frontend-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install dependencies (frontend)
        run: npm install --legacy-peer-deps

      - name: Build frontend
        run: npm run build

      - name: Check for build errors
        run: |
          if [ -d "dist" ]; then
            echo "✅ Frontend built successfully"
          else
            echo "❌ Build failed"
            exit 1
          fi

  security-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker images
        uses: docker/build-push-action@v4
        with:
          context: ./server
          file: ./server/Dockerfile
          push: false
          tags: markethub-backend:latest

      - name: Build frontend Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile.frontend
          push: false
          tags: markethub-frontend:latest

  deploy:
    runs-on: ubuntu-latest
    needs: [security-checks, docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v3

      - name: Deploy to Render
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK" ]; then
            curl -X POST $RENDER_DEPLOY_HOOK
            echo "✅ Deployment triggered on Render"
          else
            echo "⚠️ RENDER_DEPLOY_HOOK not configured"
          fi

      - name: Notify on deployment
        if: success()
        run: echo "🚀 Deployment successful!"

      - name: Notify on failure
        if: failure()
        run: echo "❌ Deployment failed!"
